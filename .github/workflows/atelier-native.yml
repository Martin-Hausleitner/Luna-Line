name: Atelier native Apple verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/atelier-native.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify the exact first-party runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/atelier-upgrade.yml').read_text()
          code=workflow.split("python3 - <<'PY'",1)[1].split('\n          PY',1)[0]
          exec(textwrap.dedent(code))
          PY
          python3 qa/atelier/environment-fix.py
          python3 qa/atelier/stabilize.py
      - name: Prepare browser test tooling
        run: |
          python3 -m venv /tmp/luna-test
          /tmp/luna-test/bin/python -m pip install playwright==1.55.0
          test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
      - name: Full native browser acceptance at 1920 by 1080
        run: |
          set -euo pipefail
          python3 -m http.server 8088 --bind 127.0.0.1 > /tmp/luna-server.log 2>&1 &
          /tmp/luna-test/bin/python qa/atelier/run-qa.py --browser '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --url http://127.0.0.1:8088/Luna-Line.html --output qa/atelier --require-webgpu 2>&1 | tee qa/atelier/execution.log
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          r=json.loads(Path('qa/atelier/report.json').read_text())
          assert r['status']=='PASS'
          assert all(t['status']=='PASS' for t in r['tests'])
          assert r['runtimeSha256']==hashlib.sha256(Path('Luna-Line.html').read_bytes()).hexdigest()
          print('Strict native gate passed:', len(r['tests']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Luna-Line-Atelier-Apple
          path: |
            Luna-Line.html
            README.md
            qa/atelier/
          retention-days: 14
