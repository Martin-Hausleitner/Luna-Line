name: LUNA LINE spatial details
on:
  push:
    branches: [main]
    paths: [qa/v2/upgrade.py]
permissions:
  contents: write
  pages: write
concurrency:
  group: luna-line-spatial-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize and syntax-check the single runtime
        run: |
          python3 qa/v2/upgrade.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Luna-Line.html').read_text()
          Path('/tmp/luna-line-check.js').write_text(s.split('<script>')[1].split('</script>')[0])
          qa=Path('qa/run-qa.mjs').read_text()
          qa=qa.replace("['--headless=new'", "['--disable-gpu-watchdog','--headless=new'")
          qa=qa.replace("browser.stderr.on('data',d=>logs+=d.toString())", "browser.stderr.on('data',d=>{logs+=d.toString();fs.writeFileSync(path.join(out,'chrome.log'),logs)})")
          qa=qa.replace('timeout=35000','timeout=120000')
          qa=qa.replace("test('Native WebGPU rendering',report.initial.renderer==='webgpu',report.initial);", "test('Native WebGPU rendering',report.initial.renderer==='webgpu',report.initial);if(report.initial.renderer!=='webgpu')throw Error('Native WebGPU unavailable: '+report.initial.gpuError);")
          qa=qa.replace("throw Error('Wait timeout '+expression)","throw Error('Wait timeout '+expression+' STATE '+JSON.stringify(await evaluate('Luna.inspect.snapshot()')))")
          qa=qa.replace("let s=await evaluate('Luna.line.seconds');await sleep(1100);", "let s=await evaluate('Luna.line.seconds');await wait('Luna.line.seconds>'+String(s+.5),5000);")
          extra="""
           await evaluate('Luna.inspect.jump(2);Luna.inspect.details.open("process")');await sleep(1000);await shot('10-process-detail.png');
           test('V2 native spatial measurements',await evaluate('Luna.detail.open&&!Luna.detail.transition&&Luna.detail.dimensionCount>=3&&Luna.gpu.mode==="webgpu"&&!Luna.gpu.error'));
           test('V2 thirty operation descriptions',await evaluate('Luna.inspect.details.snapshot().operationCount===30'));
           await evaluate('Luna.detail.tab="material";renderDetail();Luna.inspect.details.explode(1)');await sleep(600);await shot('11-layer-detail.png');
           test('V2 exploded original front',await evaluate('Luna.detail.explode===1&&Luna.line.id==="TA2026-00009-T04"&&document.getElementById("detailSummary").textContent.includes("Schichten getrennt")'));
           await evaluate('Luna.inspect.jump(5);Luna.inspect.details.open("material");Luna.inspect.details.view("back")');await sleep(900);await shot('12-back-detail.png');
           await evaluate('Luna.detail.tab="dimensions";renderDetail()');await shot('13-dimension-detail.png');
           test('V2 dimension drawing',await evaluate('Luna.detail.view==="back"&&!!document.querySelector(".blueprint")&&document.getElementById("detailBody").innerText.includes("597 × 715 × 19 mm")'));
           await evaluate('Luna.inspect.details.close(false)');
          """
          qa=qa.replace(" await key('c','KeyC');test('C shows",extra+"\n await key('c','KeyC');test('C shows",1)
          Path('qa/run-qa-ci.mjs').write_text(qa)
          PY
          node --check /tmp/luna-line-check.js
      - name: Native Apple WebGPU QA and 60-second playback
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          node qa/run-qa-ci.mjs --full
          python3 -c "import json; r=json.load(open('qa/report.json')); assert r['status']=='PASS', r"
      - name: Reject corrupted raster captures
        run: |
          python3 -m venv /tmp/luna-qa-imaging
          /tmp/luna-qa-imaging/bin/pip install --quiet Pillow==11.3.0
          /tmp/luna-qa-imaging/bin/python - <<'PY'
          from PIL import Image, ImageChops, ImageStat
          import json
          results=[]
          for name in ['02-cut.png','06-evening.png','11-layer-detail.png']:
              im=Image.open('qa/'+name).convert('RGB')
              a=im.crop((640,190,1660,800)); b=im.crop((641,190,1661,800))
              difference=sum(ImageStat.Stat(ImageChops.difference(a,b)).mean)/3
              results.append({'image':name,'horizontalNeighborMeanDifference':difference,'status':'PASS' if difference<22 else 'FAIL'})
          print(json.dumps(results,indent=2))
          assert all(r['status']=='PASS' for r in results), 'Corrupt high-frequency raster; manual vision review required.'
          open('qa/v2/raster-check.json','w').write(json.dumps(results,indent=2))
          PY
      - name: Commit validated source and local evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Luna-Line.html README.md qa/*.png qa/report.json qa/run-qa-ci.mjs qa/v2/BUILD.json qa/v2/raster-check.json
          if ! git diff --cached --quiet; then
            git commit -m 'Ship LUNA LINE v2 with native Apple WebGPU evidence'
            git push origin HEAD:main
          fi
      - name: Publish the identical runtime to the existing Pages branch
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/luna-line-pages origin/gh-pages
          cp Luna-Line.html /tmp/luna-line-pages/index.html
          cd /tmp/luna-line-pages
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish LUNA LINE spatial-detail runtime'
            git push origin HEAD:gh-pages
          fi
      - name: Request and verify the Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          expected=$(shasum -a 256 Luna-Line.html | cut -d' ' -f1)
          for attempt in $(seq 1 48); do
            curl -fsS 'https://martin-hausleitner.github.io/Luna-Line/?v=spatial-detail-2' -o /tmp/luna-live.html || true
            if test -s /tmp/luna-live.html && test "$(shasum -a 256 /tmp/luna-live.html | cut -d' ' -f1)" = "$expected"; then exit 0; fi
            sleep 5
          done
          echo 'Pages did not serve the verified runtime within the verification window.'
          exit 1
      - name: Native live Pages QA and screenshots
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          node qa/run-qa-ci.mjs --base=https://martin-hausleitner.github.io/Luna-Line/
          python3 -c "import json; r=json.load(open('qa/live/report.json')); assert r['status']=='PASS', r"
          git add qa/live
          if ! git diff --cached --quiet; then
            git commit -m 'Record native live Pages spatial-detail QA'
            git push origin HEAD:main
          fi
      - name: Preserve browser evidence for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luna-line-v2-browser-evidence
          path: |
            Luna-Line.html
            README.md
            LICENSE
            qa/
          retention-days: 14
