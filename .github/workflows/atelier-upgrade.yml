name: Atelier upgrade and browser QA
on:
  push:
    branches: [main]
    paths:
      - qa/atelier-payload.json.gz.b64
      - qa/atelier-transfer/repair.json
      - .github/workflows/atelier-upgrade.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: luna-line-atelier
  cancel-in-progress: false
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LUNA_HEADED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand the self-contained, first-party source package
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, subprocess
          from pathlib import Path
          for name, repair in json.loads(Path('qa/atelier-transfer/repair.json').read_text()).items():
              assert name in ['qa/atelier-transfer/01.b64', 'qa/atelier-transfer/03.b64']
              path = Path(name)
              text = path.read_text().strip()
              actual = hashlib.sha256(text.encode()).hexdigest()
              if actual != repair['outputSha256']:
                  assert actual == repair['inputSha256'], 'Unexpected transfer bytes: ' + name
                  for start, end, replacement in reversed(repair['edits']):
                      text = text[:start] + replacement + text[end:]
                  assert hashlib.sha256(text.encode()).hexdigest() == repair['outputSha256']
                  path.write_text(text)
          encoded = ''.join(Path('qa/atelier-transfer/%02d.b64' % i).read_text().strip() for i in range(12)) + Path('qa/atelier-payload.json.gz.b64').read_text().strip()
          assert hashlib.sha256(encoded.encode()).hexdigest() == '21b3417a69a9e015561bfb98f9d85dcaca3e25550c8ba5626e21a648d5793269', 'Source transfer hash mismatch'
          package = json.loads(gzip.decompress(base64.b64decode(encoded, validate=True)))
          assert package['original'] == '211341d00cce766ff3bb786cfa7f709bb69553f0'
          original = subprocess.check_output(['git','show',package['original']+':Luna-Line.html']).decode('utf-8')
          assert hashlib.sha256(original.encode()).hexdigest() == package['originalSha256']
          for start, end, replacement in reversed(package['edits']):
              original = original[:start] + replacement + original[end:]
          assert hashlib.sha256(original.encode()).hexdigest() == package['resultSha256'], 'Canonical runtime mismatch'
          Path('Luna-Line.html').write_text(original)
          for name, item in package['files'].items():
              path = Path(name)
              if path.is_absolute() or '..' in path.parts or not (name == 'README.md' or name.startswith('qa/atelier/')):
                  raise SystemExit('Rejected unexpected package path: ' + name)
              data = item['content'].encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == item['sha256'], name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          print('All first-party files verified before execution.')
          PY
          python3 qa/atelier/environment-fix.py
      - name: Install browser test tools, never runtime dependencies
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers
      - name: Run local browser gates and capture real WebGPU scenes
        run: |
          python3 -m http.server 8088 --bind 127.0.0.1 > /tmp/luna-server.log 2>&1 &
          DEBUG=pw:browser xvfb-run -a --server-args='-screen 0 1920x1080x24' python3 qa/atelier/run-qa.py --url http://127.0.0.1:8088/Luna-Line.html --output qa/atelier --require-webgpu 2>&1 | tee qa/atelier/execution.log
      - name: Commit only the tested canonical runtime and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Luna-Line.html README.md qa/atelier qa/atelier-transfer
          git diff --cached --quiet || git commit -m 'Ship LUNA LINE Atelier with expanded 3D, construction tools and verified browser evidence'
          git push origin HEAD:main
      - name: Publish the same bytes at Pages root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git worktree add /tmp/luna-pages origin/gh-pages
          cp Luna-Line.html /tmp/luna-pages/index.html
          cd /tmp/luna-pages
          git add index.html
          git diff --cached --quiet || git commit -m 'Publish tested LUNA LINE Atelier at Pages root'
          git push origin HEAD:gh-pages
          gh api -X POST repos/${{ github.repository }}/pages/builds
      - name: Verify live bytes and take live cuts and evening shots
        run: |
          python3 - <<'PY'
          import hashlib, time, urllib.request
          from pathlib import Path
          expected = hashlib.sha256(Path('Luna-Line.html').read_bytes()).digest()
          for attempt in range(30):
              try:
                  req = urllib.request.Request('https://martin-hausleitner.github.io/Luna-Line/?atelier-check=' + str(attempt), headers={'Cache-Control':'no-cache'})
                  if hashlib.sha256(urllib.request.urlopen(req,timeout=15).read()).digest() == expected:
                      print('Live Pages runtime is byte-for-byte identical.'); break
              except Exception as exc:
                  print(type(exc).__name__, str(exc))
              time.sleep(10)
          else:
              raise SystemExit('Live Pages still differs from the tested canonical file.')
          PY
          xvfb-run -a --server-args='-screen 0 1920x1080x24' python3 qa/atelier/run-qa.py --url https://martin-hausleitner.github.io/Luna-Line/ --output qa/atelier/live --live --require-webgpu
          git add qa/atelier/live
          git diff --cached --quiet || git commit -m 'Record live Atelier browser checks and screenshots'
          git push origin HEAD:main
      - name: Preserve evidence, including any failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Line-Atelier-QA
          path: |
            qa/atelier/
            qa/atelier-transfer/
            qa/atelier-payload.json.gz.b64
          retention-days: 14
