<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dc2438"><title>Lunis · EDV-Hausleitner</title><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#fff8f7;color:#251718;font:15px/1.5 system-ui,-apple-system,sans-serif}.box{text-align:center}.mark{width:46px;height:46px;margin:0 auto 18px;border-radius:15px;background:#dc2438;box-shadow:0 14px 45px #dc243833;animation:p 1.2s ease-in-out infinite alternate}.box b{font-size:22px}.box p{margin:7px 0;color:#76595b}@keyframes p{to{transform:scale(.9);opacity:.6}}</style></head><body><div class="box" id="status"><div class="mark"></div><b>Lunis wird geladen …</b><p>EDV-Hausleitner</p></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/Martin-Hausleitner/Luna-Line/gh-pages/lunis/parts/';const files=Array.from({length:11},(_,i)=>base+`part-${String(i+1).padStart(2,'0')}.b64`);const texts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error(`Quelldatei: ${r.status}`);return r.text()}));const b64=texts.join('').replace(/\s/g,'');const bin=atob(b64),gz=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)gz[i]=bin.charCodeAt(i);if(!('DecompressionStream' in window))throw Error('Browser unterstützt Dekomprimierung nicht');const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const dig=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html));const hex=[...new Uint8Array(dig)].map(x=>x.toString(16).padStart(2,'0')).join('');if(hex!=='5590d3384493c5828ea4cfac6dee3e14b09331b719675f9a5810df9836aa484b')throw Error('Integritätsprüfung fehlgeschlagen');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').innerHTML='<b>Lunis konnte nicht geladen werden.</b><p>'+String(e.message||e)+'</p>'}})()</script></body></html>
